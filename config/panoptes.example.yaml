# Panoptes example configuration.
# Run:  panoptes scan --config config/panoptes.example.yaml --i-am-authorized

target: "https://example.com"

# Only these plugins (empty = all). See: panoptes plugins
plugins: []
exclude_plugins: []

http:
  timeout: 15.0
  max_concurrency: 10
  requests_per_second: 10.0
  user_agent: "Panoptes/0.1 (+authorized-security-testing)"
  verify_tls: true
  follow_redirects: true
  max_retries: 2

crawl:
  enabled: true
  max_depth: 2
  max_urls: 200
  same_origin_only: true

ai:
  enabled: false
  provider: "null"      # null | openai | anthropic | ollama
  model: ""
  api_key_env: ""       # e.g. OPENAI_API_KEY
  base_url: ""
  max_payloads: 8

scope:
  # Hosts Panoptes is permitted to touch (wildcards allowed, e.g. "*.example.com").
  allow:
    - "example.com"
  deny: []
  allow_private: false
  # Must be true (or pass --i-am-authorized) for a scan to run.
  authorized: false

# Authenticated scanning (behind login). Cookies are bound to the target host
# and never sent elsewhere. Keep real credentials out of version control.
auth:
  headers: {}      # e.g. {"Authorization": "Bearer <token>"}
  cookies: {}      # e.g. {"session": "<session-value>"}

# Login macro — Panoptes submits this form and scans as the logged-in user.
login:
  url: ""                 # e.g. https://app.example.com/login
  username: ""
  password: ""
  username_field: ""      # auto-detected from the form if blank
  password_field: ""      # auto-detected from the form if blank
  success_indicator: ""   # text present only when logged in, e.g. "Log out"

# Access-control / IDOR testing (needs a session from login or auth above).
access:
  enabled: false
  idor_headers: {}        # a SECOND identity (user B) for IDOR comparison
  idor_cookies: {}        # e.g. {"session": "<user-B-session>"}

# Opt-in auth rate-limit test (sends failed logins for a RANDOM username so the
# real account is never locked). Needs the login: block above.
# Set at the CLI with --auth-ratelimit, or under the top level:
# auth_ratelimit: false

# Content / parameter discovery (wordlist brute-forcing).
discovery:
  enabled: false
  wordlist: ""            # path to a custom wordlist (built-in list if blank)
  params: ""              # path to a custom parameter list (built-in if blank)
  max_words: 400
  max_params: 120

# Optional nuclei integration (needs the nuclei binary installed).
nuclei:
  enabled: false
  timeout: 300
  extra_args: []          # e.g. ["-tags", "cve,exposure"]

# Out-of-band SSRF confirmation (bundled listener). The target must be able to
# reach `host`; use a public/reachable address for remote targets. CLI: --ssrf-oob
oob:
  enabled: false
  host: "127.0.0.1"       # address the target should call back to
  port: 0                 # 0 = pick a free port
  grace: 3.0              # seconds to wait for async callbacks

# Optional port-scan recon (used by `hunt` when enabled, or the `portscan`
# command). Uses nmap if installed, otherwise a built-in TCP connect scan.
portscan:
  enabled: false
  ports: []        # empty = curated common ports; e.g. [22, 80, 443, 8080]
  timeout: 1.5
  concurrency: 100
  use_nmap: true
